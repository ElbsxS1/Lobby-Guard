name: LobbyGuard
version: ${project.version}
main: com.asthen.lobbyguard.LobbyGuard
api-version: '26.3'
description: Lobby protegido, NPC para a sobrevivência, neve de Natal e aldeão de eventos
commands:
  event:
    description: Controla o evento (abrir, fechar, contagem e posição do aldeão)
    usage: /event <on|off|time|setnpc|status>
    aliases: [evento]
    permission: lobbyguard.admin
  lob:
    description: Volta ao lobby após 5 segundos parado
    usage: /lob
    aliases: [lobby, hub]
    permission: lobbyguard.use
  neve:
    description: Neve de Natal no lobby (on/off/encher/limpar)
    usage: /neve <on|off|encher|limpar> [raio]
    permission: lobbyguard.admin
  lobbyguard:
    description: Administra o lobby (NPC, spawn, reload)
    usage: /lobbyguard <setnpc|removenpc|setspawn|reload>
    permission: lobbyguard.admin
permissions:
  lobbyguard.use:
    description: Usar o comando /lob
    default: true
  lobbyguard.admin:
    description: Usar o comando /lobbyguard
    default: op
  lobbyguard.bypass:
    description: Ignorar as proteções do lobby (quebrar, colocar, etc.)
    default: op
  lobbyguard.event.bypass:
    description: Entrar no evento pelo aldeão mesmo com o evento fechado
    default: op
