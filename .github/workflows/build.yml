name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar
        run: mvn -B -ntp package

      - name: Guardar o jar
        uses: actions/upload-artifact@v5
        with:
          name: LobbyGuard
          path: target/LobbyGuard-*.jar
